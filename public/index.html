<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=480, user-scalable=no" />
    <title>Claudemeter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400&family=Pixelify+Sans:wght@600;700&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background: #0d0d0d;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        color: #faf9f5;
        font-family: "DM Sans", system-ui, sans-serif;
        width: min(800px, 100%);
        height: 480px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 16px 28px 12px;
        gap: 10px;
        flex-shrink: 0;
        justify-content: center;
        position: relative;
        touch-action: none;
        user-select: none;
        overscroll-behavior: none;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        height: 60px;
        gap: 12px;
      }

      .logo {
        display: block;
        width: 60px;
        height: 60px;
        flex-shrink: 0;
        border: none;
        background: transparent;
      }

      .title {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 44px;
        font-weight: 400;
        letter-spacing: 1px;
        line-height: 1;
        color: #faf9f5;
      }

      /* ── Cards ── */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        background: #1f1f1e;
        border-radius: 8px;
        padding: 12px 16px 12px;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0;
        position: relative;
      }

      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      /* % label — DM Sans bold (matches font_styrene_48) */
      .pct {
        font-family: "DM Sans", sans-serif;
        font-size: 52px;
        font-weight: 700;
        line-height: 1;
        color: #faf9f5;
        min-width: 0;
        overflow: hidden;
      }

      /* Pill — background matches bar track (#2a2a28), font_styrene_28 ≈ 20px */
      .badge {
        background: #2a2a28;
        border-radius: 999px;
        padding: 6px 18px;
        font-family: "DM Sans", sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: #faf9f5;
        flex-shrink: 0;
      }

      /* ── Progress bars — height 24px matching firmware ── */
      .progress-track {
        background: #2a2a28;
        border-radius: 6px;
        height: 24px;
        overflow: hidden;
        flex-shrink: 0;
        margin-bottom: 8px;
      }

      .progress-fill {
        height: 100%;
        border-radius: 6px;
        width: 0%;
        transition:
          width 0.7s ease,
          background-color 0.7s ease;
      }

      /* Resets in — font_styrene_28 ≈ 20px, COL_DIM */
      .countdown {
        font-family: "DM Sans", sans-serif;
        font-size: 20px;
        font-weight: 400;
        color: #b0aea5;
      }

      /* ── Sub-bars (Opus / Sonnet) ── */
      .sub-bars {
        display: none;
        flex-direction: column;
        gap: 5px;
        margin-top: 6px;
      }

      .sub-bar-row {
        display: none;
        align-items: center;
        gap: 8px;
      }

      .sub-bar-label {
        font-size: 13px;
        width: 52px;
        color: #b0aea5;
        flex-shrink: 0;
      }

      .sub-bar-track {
        background: #2a2a28;
        border-radius: 4px;
        height: 10px;
        flex: 1;
        overflow: hidden;
      }

      .sub-bar-fill {
        height: 100%;
        border-radius: 4px;
        width: 0%;
        transition: width 0.7s ease;
      }

      .sub-bar-pct {
        font-size: 13px;
        width: 36px;
        text-align: right;
        color: #b0aea5;
        flex-shrink: 0;
      }

      /* ── Error panel ── */
      #error-panel {
        display: none;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        padding: 20px 8px;
        position: relative;
        overflow: hidden;
        gap: 10px;
      }

      #error-panel.visible {
        display: flex;
      }

      #error-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0px,
          transparent 3px,
          rgba(255, 255, 255, 0.012) 3px,
          rgba(255, 255, 255, 0.012) 4px
        );
        pointer-events: none;
      }

      .err-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        font-family: "DM Mono", "Courier New", monospace;
      }

      .err-tag {
        font-size: 10px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        flex-shrink: 0;
        width: 42px;
        text-align: right;
      }

      .err-tag-err {
        color: #c0392b;
      }
      .err-tag-dim {
        color: #3a3935;
      }
      .err-tag-wait {
        color: #d97757;
      }

      .err-msg {
        font-size: 15px;
        color: #faf9f5;
        letter-spacing: 0.2px;
      }

      .err-hint {
        font-size: 12px;
        color: #4a4945;
        letter-spacing: 0.2px;
      }

      .err-retry {
        font-size: 14px;
        color: #7a7970;
        letter-spacing: 0.5px;
      }

      .err-retry em {
        font-style: normal;
        color: #b0aea5;
      }

      @keyframes err-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      .err-cursor {
        display: inline-block;
        width: 6px;
        height: 0.85em;
        background: #d97757;
        vertical-align: -1px;
        margin-left: 3px;
        animation: err-blink 1s step-end infinite;
      }

      /* ── Status bar — font_mono_32, COL_ACCENT ── */
      .status-bar {
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-text {
        font-family: "DM Mono", "Courier New", monospace;
        color: #d97757;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 1px;
        display: inline-flex;
        align-items: center;
        line-height: 1.4;
      }

      /* Fixed-size slot so the spinner glyph can't shift the verb. The
         glyphs (· ✻ ✽ …) come from per-glyph font fallback whose advance
         width AND line metrics differ (esp. on Windows), which otherwise
         jittered the verb horizontally (width) and vertically (height).
         A fixed box + flex centering + overflow:hidden decouples the
         glyph's metrics from the row entirely. */
      .spinner-glyph {
        flex: 0 0 1.6em;
        height: 1.4em;
        margin-right: 0.25em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        overflow: hidden;
      }

      /* ── Screen switch button ── */
      .nav-btn {
        position: absolute;
        top: 16px;
        right: 28px;
        z-index: 10;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: #2a2a28;
        border: none;
        color: #faf9f5;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .nav-btn svg {
        width: 24px;
        height: 24px;
      }

      .nav-btn:active {
        background: #3a3935;
      }

      /* ── Player ── */
      #player-screen {
        position: absolute;
        inset: 0;
        background: #141312 radial-gradient(#23211e 1px, transparent 1px) 0 0 / 8px 8px;
        overflow: hidden;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        font-family: "Silkscreen", monospace;
        color: #eee7d7;
      }

      #player-screen.active {
        transform: none;
      }

      .deck {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 800px;
        height: 480px;
        transform: translate(-50%, -50%) scale(var(--deck-scale, 1));
      }

      .disc {
        position: absolute;
        left: 29px;
        top: 29px;
        width: 280px;
        height: 280px;
        image-rendering: pixelated;
      }

      .tonearm {
        position: absolute;
        left: 296px;
        top: 42px;
        transform-origin: 0 0;
        transform: rotate(-32deg);
        transition: transform 0.6s steps(8);
      }

      .tonearm.on {
        transform: none;
      }

      .tonearm div {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #cfc8ba;
      }

      .tonearm .headshell {
        left: -30px;
        top: 82px;
        width: 16px;
        height: 18px;
        border-bottom: 4px solid #6f6a62;
      }

      .pivot {
        position: absolute;
        left: 285px;
        top: 31px;
        width: 22px;
        height: 22px;
        background: #6f6a62;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pivot::after {
        content: "";
        width: 8px;
        height: 8px;
        background: #201e1b;
      }

      .info {
        position: absolute;
        left: 348px;
        top: 24px;
        width: 428px;
        height: 290px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .play-state {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 22px;
        font-size: 18px;
        letter-spacing: 1px;
        color: #ff7a2f;
      }

      .play-state.paused {
        color: #a39c8f;
      }

      .play-state svg {
        width: 12px;
        height: 14px;
      }

      .track {
        font-family: "Pixelify Sans", monospace;
        font-weight: 700;
        font-size: 60px;
        line-height: 1.05;
        margin-top: 10px;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .artist {
        font-family: "Pixelify Sans", monospace;
        font-weight: 600;
        font-size: 30px;
        color: #ff7a2f;
        margin-top: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .album {
        font-size: 20px;
        color: #a39c8f;
        margin-top: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #player-screen.idle .track {
        font-size: 44px;
      }

      #player-screen.idle .artist {
        font-family: "Silkscreen", monospace;
        font-weight: 400;
        font-size: 20px;
        color: #a39c8f;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .progress {
        position: absolute;
        left: 24px;
        top: 326px;
        width: 752px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .times {
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        color: #a39c8f;
      }

      .seek {
        position: relative;
        height: 22px;
        border: 3px solid #3a3631;
        padding: 3px;
        cursor: pointer;
        touch-action: none;
      }

      .seek::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -16px;
        bottom: -16px;
      }

      .seek-fill {
        width: 0%;
        height: 100%;
        background: #ff7a2f;
      }

      .controls {
        position: absolute;
        left: 24px;
        top: 398px;
        width: 752px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      #player-screen.idle .controls,
      #player-screen.idle .progress {
        opacity: 0.35;
        pointer-events: none;
      }

      .ctl {
        background: none;
        border: none;
        color: #eee7d7;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 88px;
        height: 72px;
      }

      .ctl svg {
        width: 52px;
        height: 40px;
      }

      .ctl.pressed {
        animation: ctl-press 0.16s steps(2);
      }

      .ctl.skip-prev {
        animation: ctl-skip-prev 0.3s steps(2);
      }

      .ctl.skip-next {
        animation: ctl-skip-next 0.3s steps(2);
      }

      @keyframes ctl-press {
        0% {
          transform: translateY(4px);
          filter: brightness(0.6);
        }
      }

      @keyframes ctl-skip-prev {
        0% {
          transform: translateY(4px);
          filter: brightness(0.6);
        }
        33% {
          transform: translateX(-8px);
        }
      }

      @keyframes ctl-skip-next {
        0% {
          transform: translateY(4px);
          filter: brightness(0.6);
        }
        33% {
          transform: translateX(8px);
        }
      }

      .ctl.play svg {
        width: 44px;
        height: 44px;
      }

      .ctl.toggle {
        position: relative;
        width: 72px;
        color: #6f6a62;
      }

      .ctl.toggle svg {
        width: 36px;
        height: 27px;
      }

      .ctl.toggle::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
      }

      .ctl.toggle.on {
        color: #ff7a2f;
      }

      .ctl.toggle.on::after {
        background: #ff7a2f;
      }

      .ctl .icon-repeat-one {
        display: none;
      }

      .ctl.repeat-one .icon-repeat-one {
        display: block;
      }

      .ctl.repeat-one .icon-repeat {
        display: none;
      }

      .ctl .icon-smart {
        display: none;
      }

      .ctl.smart .icon-smart {
        display: block;
        width: 39px;
        height: 30px;
      }

      .ctl.smart .icon-shuffle {
        display: none;
      }

      .player-msg {
        position: absolute;
        z-index: 6;
        left: 24px;
        right: 100px;
        top: 6px;
        text-align: center;
        font-size: 14px;
        color: #ff7a2f;
        letter-spacing: 0.5px;
      }

      .shelf {
        display: none;
        position: absolute;
        inset: 14px 0 -14px;
        z-index: 4;
      }

      #player-screen.shelf-on .shelf {
        display: block;
      }

      .shelf.leaving {
        opacity: 0;
        transition: opacity 0.4s steps(5);
      }

      .shelf.entering {
        transition: opacity 0.4s steps(5);
      }

      .shelf div,
      .shelf canvas {
        position: absolute;
      }

      .shelf canvas {
        image-rendering: pixelated;
      }

      .shelf-cover {
        position: absolute;
        width: 112px;
        height: 112px;
        padding: 0;
        border: 0;
        background: #2e2b27;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition: transform 0.15s steps(2);
      }

      .shelf-cover canvas {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }

      .shelf-cover.picked {
        z-index: 2;
        outline: 3px solid #ff7a2f;
        outline-offset: -3px;
      }

      .shelf-peek {
        width: 96px;
        height: 96px;
        transition: transform 0.3s steps(5);
      }

      .shelf-peek.out {
        z-index: 1;
        transform: translateX(84px);
      }

      .shelf-cat {
        cursor: pointer;
        top: 425px;
        width: 66px;
        height: 51px;
        display: none;
      }

      .shelf-glow {
        inset: -400px;
        pointer-events: none;
        background: radial-gradient(circle at 1176px 552px, rgba(255, 170, 90, 0.28), rgba(255, 170, 90, 0.08) 220px, rgba(5, 8, 25, 0.25) 520px);
      }

      .shelf-note {
        position: absolute;
        width: 14px;
        height: 18px;
        pointer-events: none;
        animation: note-rise 2.4s steps(12) forwards;
      }

      @keyframes note-rise {
        to {
          transform: translate(var(--drift), -64px);
          opacity: 0;
        }
      }

      .shelf-hit {
        position: absolute;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .shelf.day .night-only,
      .shelf:not(.day) .day-only {
        display: none;
      }

      .shelf:not(.day) .wall {
        filter: brightness(0.42);
      }

      .shelf.day .lamp-shade {
        filter: brightness(0.78) saturate(0.5);
      }

      .shelf.day .shelf-glow {
        background: radial-gradient(circle at 800px 540px, rgba(255, 250, 230, 0.16), transparent 360px);
      }

      .twinkle {
        animation: twinkle 3s steps(2) infinite;
      }

      @keyframes twinkle {
        50% { opacity: 0.45; }
      }

      .disc.flying {
        z-index: 5;
        transform-origin: 0 0;
      }

      .disc.landing {
        transition: transform 0.5s steps(8);
      }

      /* ── Mini screen overrides (≤ 800×480 physical display) ── */
            .mini body {
        height: 100vh;
        width: 100vw;
        padding: 0px 40px;
        gap: 0px;
      }

      .mini .header {
        height: 80px;
        gap: 14px;
      }

      .mini .logo {
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
      }

      .mini .title {
        margin-bottom: 36px;
        margin-left: 8px;
        font-size: 64px;
      }

      .mini .cards {
        gap: 18px;
      }

      .mini .card {
        padding: 16px 24px;
      }

      .mini .card-header {
        margin-bottom: 10px;
        align-items: center;
        margin-bottom: 18px;
      }

      .mini .pct {
        font-size: 55px;
      }

      .mini .badge {
        font-size: 32px;
        padding: 10px 22px;
      }

      .mini .progress-track {
        height: 24px;
        margin-bottom: 18px;
      }

      .mini .countdown {
        font-size: 40px;
        letter-spacing: 1.2px;
      }

      .mini .status-text {
        font-size: 32px;
        letter-spacing: 1.5px;
        margin-top: 22px;
      }

      .mini .nav-btn {
        top: 36px;
        right: 40px;
        width: 64px;
        height: 64px;
      }

      .mini .nav-btn svg {
        width: 32px;
        height: 32px;
      }

      .nav-btn.retro,
      .nav-btn.retro:active {
        padding: 0;
        border-radius: 0;
        background: transparent;
      }

      .nav-btn.retro svg {
        width: 100%;
        height: 100%;
      }

      .nav-btn.retro:active .frame {
        fill: #ff7a2f;
      }

      .home-btn {
        display: none;
      }

      .home-btn.shown {
        display: block;
      }

      .nav-btn.beside-home {
        right: 88px;
      }

      .mini .nav-btn.beside-home {
        right: 116px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <video class="logo" id="sprite" autoplay loop muted playsinline></video>
      <span class="title">Usage</span>
    </div>

    <div class="cards">
      <div class="card" id="current-card">
        <div class="card-header">
          <span class="pct" id="current-pct">--%</span>
          <span class="badge">Current</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="current-bar"></div>
        </div>
        <div class="countdown" id="current-countdown">---</div>
      </div>

      <div class="card" id="weekly-card">
        <div class="card-header">
          <span class="pct" id="weekly-pct">--%</span>
          <span class="badge">Weekly</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="weekly-bar"></div>
        </div>
        <div class="countdown" id="weekly-countdown">---</div>
        <div class="sub-bars" id="sub-bars">
          <div class="sub-bar-row" id="opus-row">
            <span class="sub-bar-label">Opus</span>
            <div class="sub-bar-track">
              <div class="sub-bar-fill" id="opus-fill"></div>
            </div>
            <span class="sub-bar-pct" id="opus-pct"></span>
          </div>
          <div class="sub-bar-row" id="sonnet-row">
            <span class="sub-bar-label">Sonnet</span>
            <div class="sub-bar-track">
              <div class="sub-bar-fill" id="sonnet-fill"></div>
            </div>
            <span class="sub-bar-pct" id="sonnet-pct"></span>
          </div>
        </div>
      </div>

      <div id="error-panel">
        <div class="err-row">
          <span class="err-tag err-tag-err">err</span>
          <span class="err-msg" id="err-msg">—</span>
        </div>
        <div class="err-row" id="err-hint-row">
          <span class="err-tag err-tag-dim">—</span>
          <span class="err-hint" id="err-hint"></span>
        </div>
        <div class="err-row" style="margin-top: 6px">
          <span class="err-tag err-tag-wait">wait</span>
          <span class="err-retry"
            >retrying in <em id="err-countdown">30</em>s<span
              class="err-cursor"
            ></span
          ></span>
        </div>
      </div>

      <div class="status-bar">
        <span class="status-text" id="status-text"><span class="spinner-glyph" id="status-icon"></span><span id="status-verb"></span></span>
      </div>
    </div>

    <div id="player-screen">
      <div class="deck" id="deck">
        <canvas class="disc" id="disc" width="56" height="56"></canvas>
        <div class="tonearm" id="tonearm"><div class="headshell"></div></div>
        <div class="pivot"></div>

      let lastPhrase = 0;

      function tickSpinner() {
        const now = Date.now();

        if (now - lastPhrase >= 4000) {
          let next;
          do {
            next = Math.floor(Math.random() * PHRASES.length);
          } while (next === phraseIdx);
          phraseIdx = next;
          lastPhrase = now;
        }

        if (now - lastSpinner >= SPINNER_MS[spinnerIdx]) {
          lastSpinner = now;
          spinnerPhase = (spinnerPhase + 1) % SPINNER_PHASES;
          spinnerIdx =
            spinnerPhase < SPINNER_COUNT
              ? spinnerPhase
              : SPINNER_PHASES - spinnerPhase;
        }

        if (fetchError) return;
        const icon = document.getElementById("status-icon");
        if (isMaxed) {
          icon.textContent = "";
          icon.style.display = "none";
          document.getElementById("status-verb").textContent =
            "limit reached. claude is napping…";
          return;

        icon.style.display = "";
        icon.textContent = SPINNER_FRAMES[spinnerIdx];
        document.getElementById("status-verb").textContent =
          PHRASES[phraseIdx] + "…";

      /* ── Usage rendering ── */
      let usageData = null;

      // Matches pct_color() in ui.cpp exactly
      function getColor(pct) {
        if (pct >= 80) return "#c0392b";
        if (pct >= 50) return "#d97757";
        return "#788c5d";
      }

      function formatCountdown(isoString) {
        const diff = new Date(isoString) - Date.now();
        if (diff <= 0) return "Resetting…";
        const totalSec = Math.floor(diff / 1000);
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400) / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        if (days > 0) return `Resets in ${days}d ${hours}h`;
        if (hours > 0) return `Resets in ${hours}h ${mins}m`;
        return `Resets in ${mins}m ${secs}s`;
      }

      function applyBar(fillId, pctId, utilization, fixedColor) {
        const pct = Math.round(Math.max(0, Math.min(100, utilization)));
        const color = fixedColor ?? getColor(pct);
        document.getElementById(fillId).style.width = pct + "%";
        document.getElementById(fillId).style.background = color;
        if (pctId) {
          document.getElementById(pctId).textContent = pct + "%";
        }
      }

      let isMaxed = false;

      function updateMaxedSprite(maxed) {
        if (maxed === isMaxed) return;
        isMaxed = maxed;
        if (maxed) {
          spritesPaused = true;
          setSprite(SPRITE_BASE + "expression_sleep.mp4");
          document.getElementById("current-bar").style.width = "100%";
          document.getElementById("current-pct").textContent = "100%";
        } else {
          spritesPaused = false;
          setSprite(SPRITE_BASE + SPRITES[spriteIdx]);
        }
      }

      function render(data) {
        if (!data.five_hour || !data.seven_day) return;
        usageData = data;

        applyBar(
          "current-bar",
          "current-pct",
          data.five_hour.utilization,
          "#d97757",
        );
        applyBar("weekly-bar", "weekly-pct", data.seven_day.utilization);

        const hasOpus = data.seven_day_opus !== null;
        const hasSonnet = data.seven_day_sonnet !== null;
        const hasAny = hasOpus || hasSonnet;

        document.getElementById("sub-bars").style.display = hasAny
          ? "flex"
          : "none";
        document.getElementById("opus-row").style.display = hasOpus
          ? "flex"
          : "none";
        document.getElementById("sonnet-row").style.display = hasSonnet
          ? "flex"
          : "none";

        if (hasOpus)
          applyBar("opus-fill", "opus-pct", data.seven_day_opus.utilization);
        if (hasSonnet)
          applyBar(
            "sonnet-fill",
            "sonnet-pct",
            data.seven_day_sonnet.utilization,
          );

        const maxed =
          data.five_hour.utilization >= 100 ||
          data.seven_day.utilization >= 100 ||
          (hasOpus && data.seven_day_opus.utilization >= 100) ||
          (hasSonnet && data.seven_day_sonnet.utilization >= 100);
        updateMaxedSprite(maxed);

        tickTime();
      }

      function tickTime() {
        if (!usageData) return;
        document.getElementById("current-countdown").textContent =
          formatCountdown(usageData.five_hour.resets_at);
        document.getElementById("weekly-countdown").textContent =
          formatCountdown(usageData.seven_day.resets_at);
      }

      function renderError(msg, hint) {
        fetchError = true;
        spritesPaused = true;
        setSprite(SPRITE_BASE + "idle_blink.mp4");

        document.getElementById("current-card").style.display = "none";
        document.getElementById("weekly-card").style.display = "none";
        document.getElementById("error-panel").classList.add("visible");
        document.getElementById("status-icon").textContent = "";
        document.getElementById("status-verb").textContent = "";

        document.getElementById("err-msg").textContent = msg;

        const hintRow = document.getElementById("err-hint-row");
        if (hint) {
          document.getElementById("err-hint").textContent = hint;
          hintRow.style.display = "flex";
        } else {
          hintRow.style.display = "none";
        }

        if (retryTimer) clearInterval(retryTimer);
        let countdown = 30;
        document.getElementById("err-countdown").textContent = countdown;
        retryTimer = setInterval(() => {
          countdown = Math.max(0, countdown - 1);
          document.getElementById("err-countdown").textContent = countdown;
          if (countdown === 0) clearInterval(retryTimer);
        }, 1000);
      }

      function renderOk() {
        if (!fetchError) return;
        fetchError = false;
        spritesPaused = false;
        setSprite(SPRITE_BASE + SPRITES[spriteIdx]);
        document.getElementById("current-card").style.display = "";
        document.getElementById("weekly-card").style.display = "";
        document.getElementById("error-panel").classList.remove("visible");
        document.getElementById("status-text").style.color = "#d97757";
        if (retryTimer) clearInterval(retryTimer);
      }

      async function fetchAndRender() {
        try {
          const res = await fetch("/usage");
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            renderError(
              body.message || `HTTP ${res.status}`,
              body.hint || null,
            );
            return;
          }
          const data = await res.json();
          renderOk();
          render(data);
        } catch (e) {
          console.error("Failed to fetch /usage:", e);
          renderError(e.message || "fetch error", null);
        }
      }

        document
          .getElementById("player-screen")

        const shown = playerVisible && !!player;

        document.getElementById("nav-btn").classList.toggle("beside-home", shown);

      function setPlayerVisible(visible) {
        playerVisible = visible;
        renderNav();
        if (playerVisible) fetchPlayer();

        .getElementById("nav-btn")

      const playerScreen = document.getElementById("player-screen");

      function fitDeck() {
        const scale = Math.min(
          playerScreen.clientWidth / 800,
          playerScreen.clientHeight / 480,
        );
        document.getElementById("deck").style.setProperty("--deck-scale", scale);
      }

      window.addEventListener("resize", fitDeck);

      let swipeStartX = null;

      document.body.addEventListener("pointerdown", (ev) => {
        swipeStartX = ev.target.closest("button, .seek") ? null : ev.clientX;
      });

      document.body.addEventListener("pointermove", (ev) => {
        if (swipeStartX === null) return;
        const dx = ev.clientX - swipeStartX;
        const width = playerScreen.offsetWidth;
        const offset = playerVisible ? dx : width + dx;
        playerScreen.style.transition = "none";
        playerScreen.style.transform = `translateX(${Math.max(0, Math.min(width, offset))}px)`;
      });

      function endSwipe(ev) {
        if (swipeStartX === null) return;
        const dx = ev.type === "pointerup" ? ev.clientX - swipeStartX : 0;
        swipeStartX = null;
        playerScreen.style.transition = "";
        playerScreen.style.transform = "";
        if (dx < -80 && !playerVisible) setPlayerVisible(true);
        if (dx > 80 && playerVisible) setPlayerVisible(false);

      document.body.addEventListener("pointerup", endSwipe);

      function drawDisc() {
        const n = DISC_SIZE;
        const c = (n - 1) / 2;
        const r = n / 2;
        const labelR = r * 0.62;
        const angle = (-discFrame * Math.PI * 2) / DISC_FRAMES;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const image = discCtx.createImageData(n, n);

        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            const dx = x - c;
            const dy = y - c;
            const d = Math.hypot(dx, dy);
            if (d > r - 0.2) continue;

            let rgb;
            if (d > r - 1.4) rgb = DISC_RIM;
            else if (d < 1.4) rgb = DISC_HOLE;
            else if (d < labelR) {
              if (d > labelR - 1) rgb = DISC_RIM;
              else if (!coverPixels) rgb = DISC_LABEL;
              else {
                const rx = dx * cos - dy * sin;
                const ry = dx * sin + dy * cos;
                const u = Math.min(COVER_SIZE - 1, Math.max(0, Math.floor(((rx / labelR + 1) / 2) * COVER_SIZE)));
                const v = Math.min(COVER_SIZE - 1, Math.max(0, Math.floor(((ry / labelR + 1) / 2) * COVER_SIZE)));
                const i = (v * COVER_SIZE + u) * 4;
                rgb = [coverPixels[i], coverPixels[i + 1], coverPixels[i + 2]];
              }
            } else rgb = DISC_GROOVES[Math.floor(d) % 2];

            if (d >= labelR + 1 && d <= r - 2) {
              const deg = (Math.atan2(dy, dx) * 180) / Math.PI;
              if (Math.abs(deg + 45) < 7 || Math.abs(deg - 135) < 7) {
                rgb = rgb.map((value) => value + (255 - value) * 0.12);
              }
            }

            const o = (y * n + x) * 4;
            image.data[o] = rgb[0];
            image.data[o + 1] = rgb[1];
            image.data[o + 2] = rgb[2];
            image.data[o + 3] = 255;
          }
        }

        discCtx.putImageData(image, 0, 0);
      }

        [[16, 10, 7], [39, 9, 6]].forEach(([cy, outer, inner]) => {

          const cyy = by + cy;
          disc(cx, cyy, outer + level, "#1e1a17");
          disc(cx, cyy, inner + level, "#3a3631");
          disc(cx, cyy, 2 + level, "#a39c8f");
        });
      }

      setInterval(() => {
        if (!shelf.classList.contains("playing")) return drawSpeaker(0);
        drawSpeaker(SPEAKER_BEAT[speakerStep++ % SPEAKER_BEAT.length]);
      }, 110);

      function shelfTop(x, y) {
        block(x + 4, y - 8, 104, 8, "rgba(0,0,0,0.3)");
        block(x, y - 30, 108, 30, "#2a2522");
        block(x, y - 30, 108, 3, "#4a433d");
        block(x + 10, y - 36, 72, 6, "#0e0d12");
        block(x + 38, y - 38, 16, 2, "#ff7a2f");
        block(x + 90, y - 44, 4, 14, "#cfc8ba");
        block(x + 76, y - 44, 18, 4, "#cfc8ba");
        block(x + 4, y - 12, 6, 6, "#ff7a2f");
        speaker.width = 48;
        speaker.height = 60;
        speaker.style.cssText = `left:${x + 116}px;top:${y - 60}px;width:48px;height:60px`;
        shelf.appendChild(speaker);
        drawSpeaker(0);
        const hit = document.createElement("button");
        hit.className = "shelf-hit";
        hit.setAttribute("aria-label", "Open player");
        hit.style.cssText = `left:${x}px;top:${y - 56}px;width:162px;height:56px`;
        hit.addEventListener("click", () => {
          if (shelfBrowse && player) closeShelf();
        });
        shelf.appendChild(hit);
      }

      function buildShelf() {
        shelfFloor();
        shelfWindow();
        const rows = [112, 262];
        const positions = [];
        rows.forEach((y) => {
          for (let i = 0; i < 5; i++) positions.push([72 + i * 136, y + 18]);
        });
        positions.forEach(([x, y], i) => {
          const peek = document.createElement("canvas");
          peek.width = DISC_SIZE;
          peek.height = DISC_SIZE;
          peek.className = "shelf-peek";
          peek.style.cssText = `left:${x + 8}px;top:${y + 8}px;visibility:hidden`;
          shelf.appendChild(peek);

          const button = document.createElement("button");
          button.className = "shelf-cover";
          button.style.cssText = `left:${x}px;top:${y}px;visibility:hidden`;
          const art = document.createElement("canvas");
          art.width = SHELF_COVER_SIZE;
          art.height = SHELF_COVER_SIZE;
          button.appendChild(art);
          button.addEventListener("click", () => pickRecord(i));
          shelf.appendChild(button);

          shelfSlots.push({ x, y, peek, button, art, rec: null, img: null });
        });
        [[64, 242, 672], [64, 392, 672], [592, 100, 176], [32, 100, 176]].forEach(([x, y, w]) => {
          block(x, y + 20, w, 8, "rgba(0,0,0,0.3)");
          block(x, y, w, 20, "#5c3f26");
          block(x, y, w, 4, "#8a6240");
          block(x, y + 16, w, 4, "#3a2716");
          [x + 24, x + w - 32].forEach((bx) => {
            block(bx, y + 20, 8, 4, "#2a2723");
            block(bx, y + 24, 4, 8, "#2a2723");
          });
        });
        shelfTop(39, 100);
        shelfBooks(605, 100);
        shelfGuitar(4, 446);
        shelfLamp(752, 442);
        cat.className = "shelf-cat";
        shelf.appendChild(cat);
        shelf.appendChild(document.createElement("div")).className = "shelf-glow";
      }

      function fillShelf(tracks) {
        shelfSlots.forEach((slot, i) => {
          const rec = tracks[i] ?? null;
          slot.rec = rec;
          slot.img = null;
          slot.button.classList.remove("picked");
          slot.peek.classList.remove("out");
          slot.peek.style.visibility = "hidden";
          slot.button.style.visibility = rec ? "visible" : "hidden";
          slot.art.getContext("2d").clearRect(0, 0, SHELF_COVER_SIZE, SHELF_COVER_SIZE);
          if (!rec) return;
          slot.button.setAttribute("aria-label", `Play ${rec.album}`);
          if (!rec.image) return;
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            if (slot.rec !== rec) return;
            slot.img = img;
            slot.art.getContext("2d").drawImage(img, 0, 0, SHELF_COVER_SIZE, SHELF_COVER_SIZE);
          };
          img.src = rec.image;
        });
      }

      async function loadRecent() {
        shelf.classList.remove("leaving");
        try {
          const res = await fetch("/spotify/recent");
          const data = await res.json();
          if (!res.ok) {
            showPlayerMsg(data.message || `HTTP ${res.status}`);
            return;
          }
          fillShelf(data);
        } catch (e) {
          showPlayerMsg(e.message || "fetch error");
        }
      }

      async function pickRecord(i) {
        const slot = shelfSlots[i];
        if (shelfBusy || !slot.rec) return;
        shelfBusy = true;
        shelfBrowse = false;
        shelfHoldUntil = Date.now() + 8000;
        const rec = slot.rec;
        const request = fetch(`/spotify/album?value=${encodeURIComponent(rec.uri)}`, { method: "POST" });

        coverUrl = rec.image;
        coverPixels = slot.img ? sampleCover(slot.img) : null;
        discFrame = 0;
        drawDisc();
        slot.peek.getContext("2d").drawImage(discCtx.canvas, 0, 0);
        slot.peek.style.visibility = "visible";
        slot.button.classList.add("picked");
        requestAnimationFrame(() => slot.peek.classList.add("out"));
        await new Promise((r) => setTimeout(r, 330));

        const disc = discCtx.canvas;
        const startX = slot.x + 8 + 84 - 29;
        const startY = slot.y + 14 + 8 - 29;
        disc.classList.add("flying");
        disc.style.transform = `translate(${startX}px, ${startY}px) scale(${96 / 280})`;
        slot.peek.style.visibility = "hidden";
        renderPlayer({
          connected: true,
          is_playing: true,
          progress_ms: 0,
          duration_ms: 0,
          track: rec.album,
          artist: rec.artist,
          album: rec.album,
          image: rec.image,
          shuffle: false,
          smart_shuffle: false,
          repeat: "off",
        });
        tonearm.classList.remove("on");
        document.getElementById("player-screen").classList.add("shelf-on");
        void disc.offsetWidth;
        disc.classList.add("landing");
        disc.style.transform = "";
        shelf.classList.add("leaving");
        await new Promise((r) => setTimeout(r, 500));

        disc.classList.remove("flying", "landing");
        document.getElementById("player-screen").classList.remove("shelf-on");
        renderPlayState();

        const res = await request.catch((e) => ({ ok: false, json: async () => ({ message: e.message }) }));
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showPlayerMsg(body.message || `HTTP ${res.status}`);
          shelfHoldUntil = 0;
        }
        shelfBusy = false;
        setTimeout(fetchPlayer, 600);
      }

      const CAT_WALK = [
        [
          ".dd...................",
          ".td.........tt.....tt.",
          "..tt........ttt...ttt.",
          "..tt........ttdtdtdtt.",
          "..tt........ttttwtttt.",
          "..tt........twewwwewt.",
          "..tt.......kwwwwnwwwwk",
          "..ttttttttttwwwwwwwww.",
          "..ttdttdttdtwwwwwww...",
          "..tttdttdtttwwwwwww...",
          "..ttooottttwwwwwwww...",
          "..twoowwwwwwwwwwwww...",
          "...wwwwwwwwwwwwwww....",
          "....wwwwwwwwwwwww.....",
          "...ss.ww.....ww.ss....",
          "..ss....ww.ww.....ss..",
          "..ss....ww.ww.....ss..",
        ],
        [
          "..dd..................",
          "..td........tt.....tt.",
          "..tt........ttt...ttt.",
          "..tt........ttdtdtdtt.",
          "..tt........ttttwtttt.",
          "..tt........twewwwewt.",
          "..tt.......kwwwwnwwwwk",
          "..ttttttttttwwwwwwwww.",
          "..ttdttdttdtwwwwwww...",
          "..tttdttdtttwwwwwww...",
          "..ttooottttwwwwwwww...",
          "..twoowwwwwwwwwwwww...",
          "...wwwwwwwwwwwwwww....",
          "....wwwwwwwwwwwww.....",
          "....ss.ww....ww.ss....",
          "....ss.ww....ww.ss....",
          "....ss.ww....ww.ss....",
        ],
      ];
      const CAT_SIT = [
        "......................",
        "......................",
        "............tt.....tt.",
        "............ttt...ttt.",
        "............ttdtdtdtt.",
        "............ttttwtttt.",
        "............twewwwewt.",
        "...........kwwwwnwwwwk",
        "........ttttwwwwwwwww.",
        ".......ttdttwwwwwww...",
        "......ttdttdwwwwwww...",
        ".....tttdtttwwwwwww...",
        ".....ttooottwwwwwww...",
        ".....tttoootwwwwwww...",
        ".....ttttttwwwww.ww...",
        ".....wwwwwwwwwww.ww...",
        "dttttwwwwwwww.ww.ww...",
      ];
      const CAT_LICK = [
        [
          "......................",
          "......................",
          "............tt.....tt.",
          "............ttt...ttt.",
          "............ttdtdtdtt.",
          "............ttttwtttt.",
          "............twewwwewt.",
          "...........kwwwwnwwwss",
          "........ttttwwwwwwwwws",
          ".......ttdttwwwwwwws..",
          "......ttdttdwwwwwws...",
          ".....tttdtttwwwwwsw...",
          ".....ttooottwwwwwww...",
          ".....tttoootwwwwwww...",
          ".....ttttttwwwww......",
          ".....wwwwwwwwwww......",
          "dttttwwwwwwww.ww......",
        ],
        [

          "............tt.....tt.",
          "............ttt...ttt.",
          "............ttdtdtdtt.",

          "............twewwwewss",
          "........tttkwwwwnwwwws",
          ".......ttdttwwwwwwnsw.",
          "......ttdttdwwwwwws...",
          ".....tttdtttwwwwwsw...",
          ".....ttooottwwwwwww...",
          ".....tttoootwwwwwww...",
          ".....ttttttwwwww......",
          ".....wwwwwwwwwww......",
          "dttttwwwwwwww.ww......",
        ],
      ];
      const CAT_COLORS = { t: "#7a6f63", d: "#3f3832", w: "#eeeae2", s: "#bdb6aa", o: "#c98a4a", e: "#1c1a19", n: "#e7a0a8", k: "#cfc8ba" };
      const cat = document.createElement("canvas");
      cat.width = 22;
      cat.height = 17;
      const catCtx = cat.getContext("2d");
      cat.addEventListener("click", () => playFromShelf(`/spotify/track?value=${encodeURIComponent("spotify:track:4ls5LcW90peNWMSqneNLDS")}`));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      function drawCat(rows) {
        catCtx.clearRect(0, 0, cat.width, cat.height);
        rows.forEach((row, y) =>
          [...row].forEach((ch, x) => {
            if (!CAT_COLORS[ch]) return;
            catCtx.fillStyle = CAT_COLORS[ch];
            catCtx.fillRect(x, y, 1, 1);
          }),
        );
      }

      function scheduleCat(delay) {
        setTimeout(walkCat, delay ?? 20000 + Math.random() * 40000);
      }

      async function catLick() {
        drawCat(CAT_SIT);
        await wait(700);
        for (let i = 0; i < 10; i++) {
          drawCat(CAT_LICK[i % 2]);
          await wait(280);
        }
        drawCat(CAT_SIT);
        await wait(800);
      }

      async function walkCat() {
        if (!playerVisible || !playerScreen.classList.contains("shelf-on")) return scheduleCat();
        const dir = Math.random() < 0.5 ? 1 : -1;
        let x = dir > 0 ? -120 : 860;
        let stopAt = Math.random() < 0.5 ? 200 + Math.random() * 400 : null;
        let step = 0;
        cat.style.transform = dir > 0 ? "" : "scaleX(-1)";
        cat.style.display = "block";
        while (x > -121 && x < 861) {
          if (stopAt !== null && Math.abs(x - stopAt) < 9) {
            stopAt = null;
            await catLick();
          }
          x += 9 * dir;
          drawCat(CAT_WALK[step++ % 2]);
          cat.style.left = `${x}px`;
          await wait(150);
        }
        cat.style.display = "none";
        scheduleCat();
      }

      document.getElementById("home-btn").addEventListener("click", async () => {
        if (shelfBusy) return;
        const screen = document.getElementById("player-screen");
        if (!shelfBrowse) {
          shelfBusy = true;
          await loadRecent();
          shelfBrowse = true;
          renderHome();
          shelf.classList.add("leaving");
          screen.classList.add("shelf-on");
          void shelf.offsetWidth;
          shelf.classList.add("entering");
          shelf.classList.remove("leaving");
          await new Promise((r) => setTimeout(r, 400));
          shelf.classList.remove("entering");
          shelfBusy = false;
          return;
        }
        closeShelf();
      });

      async function playFromShelf(url) {
        if (shelfBusy) return;
        shelfBusy = true;
        shelfHoldUntil = Date.now() + 8000;
        const res = await fetch(url, { method: "POST" }).catch((e) => ({ ok: false, json: async () => ({ message: e.message }) }));
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showPlayerMsg(body.message || `HTTP ${res.status}`);
          shelfHoldUntil = 0;
          shelfBusy = false;
          return;
        }
        shelf.classList.add("leaving");
        await new Promise((r) => setTimeout(r, 400));
        shelfBrowse = false;
        shelfBusy = false;
        document.getElementById("player-screen").classList.remove("shelf-on");
        renderHome();
        fetchPlayer();
      }

      async function closeShelf() {
        if (shelfBusy) return;
        shelfBusy = true;
        shelf.classList.add("leaving");
        await new Promise((r) => setTimeout(r, 400));
        shelfBrowse = false;
        shelfBusy = false;
        document.getElementById("player-screen").classList.remove("shelf-on");
        renderHome();
        fetchPlayer();
      }

      const NOTES = [
        [7, '<rect x="0" y="6" width="4" height="3"/><rect x="3" y="0" width="1" height="7"/><rect x="4" y="0" width="2" height="1"/><rect x="5" y="1" width="1" height="2"/>'],
        [4, '<rect x="0" y="6" width="4" height="3"/><rect x="3" y="0" width="1" height="7"/>'],
        [4, '<rect x="0" y="6" width="4" height="1"/><rect x="0" y="8" width="4" height="1"/><rect x="0" y="7" width="1" height="1"/><rect x="3" y="0" width="1" height="8"/>'],
        [7, '<rect x="0" y="6" width="4" height="3"/><rect x="3" y="0" width="1" height="7"/><rect x="4" y="0" width="2" height="1"/><rect x="5" y="1" width="1" height="2"/><rect x="4" y="3" width="2" height="1"/><rect x="5" y="4" width="1" height="1"/>'],
        [10, '<rect x="0" y="6" width="3" height="3"/><rect x="6" y="6" width="3" height="3"/><rect x="2" y="0" width="1" height="7"/><rect x="8" y="0" width="1" height="7"/><rect x="2" y="0" width="7" height="2"/>'],
      ];

      let noteBag = [];
      let lastNote = -1;

      function nextNote() {
        if (!noteBag.length) {
          noteBag = NOTES.map((_, i) => i).sort(() => Math.random() - 0.5);
          if (noteBag[0] === lastNote) noteBag.push(noteBag.shift());
        }
        lastNote = noteBag.shift();
        return NOTES[lastNote];
      }

      function spawnNote() {
        const note = document.createElement("div");
        note.className = "shelf-note";
        note.style.left = `${161 + Math.round(Math.random() * 24)}px`;
        note.style.top = "34px";
        note.style.setProperty("--drift", `${Math.round(Math.random() * 32 - 16)}px`);
        const [w, rects] = nextNote();
        note.style.width = `${w * 2}px`;
        note.innerHTML = `<svg viewBox="0 0 ${w} 9" width="${w * 2}" height="18" fill="#eee7d7" shape-rendering="crispEdges">${rects}</svg>`;
        note.addEventListener("animationend", () => note.remove());
        shelf.appendChild(note);
      }

      setInterval(() => {
        if (playerVisible && shelf.classList.contains("playing") && playerScreen.classList.contains("shelf-on")) spawnNote();
      }, 900);

      buildShelf();
      renderDayNight();
      setInterval(renderDayNight, 60_000);
      scheduleCat(8000);

      renderNav();
      renderPlayState();
      drawDisc();

      fetchAndRender();
      setInterval(fetchAndRender, 30_000);
      setInterval(tickTime, 1_000);
      setInterval(tickSpinner, 50); // check every 50ms, fire based on per-frame ms
    </script>
  </body>
