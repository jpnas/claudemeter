<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, user-scalable=no">
  <title>Claude Usage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #000;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      width: 800px;
      height: 480px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px 20px 10px;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      height: 52px;
      gap: 16px;
    }

    .robot {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      image-rendering: pixelated;
    }

    .title {
      font-family: 'Righteous', cursive;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #fff;
    }

    /* ── Cards ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: #150e20;
      border-radius: 12px;
      padding: 12px 18px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .pct {
      font-size: 56px;
      font-weight: bold;
      line-height: 1;
    }

    .badge {
      background: #5b21b6;
      border-radius: 20px;
      padding: 5px 20px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #fff;
    }

    /* ── Progress bars ── */
    .progress-track {
      background: #3d1a58;
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      border-radius: 6px;
      width: 0%;
      transition: width 0.6s ease, background-color 0.6s ease;
    }

    .countdown {
      font-size: 15px;
      opacity: 0.9;
    }

    /* ── Sub-bars (Opus / Sonnet) ── */
    .sub-bars {
      display: none;
      flex-direction: column;
      gap: 5px;
      margin-top: 2px;
    }

    .sub-bar-row {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .sub-bar-label {
      font-size: 11px;
      width: 48px;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .sub-bar-track {
      background: #3d1a58;
      border-radius: 4px;
      height: 8px;
      flex: 1;
      overflow: hidden;
    }

    .sub-bar-fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.6s ease;
    }

    .sub-bar-pct {
      font-size: 11px;
      width: 34px;
      text-align: right;
      opacity: 0.65;
      flex-shrink: 0;
    }

    /* ── Status bar ── */
    .status-bar {
      flex-shrink: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      color: #f97316;
      font-size: 14px;
      letter-spacing: 2px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }
  </style>
</head>
<body>

  <div class="header">
    <!-- 8×8 pixel art robot, orange/red, matching reference image -->
    <svg class="robot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8">
      <g fill="#e8612a">
        <rect x="2" y="0" width="4" height="1"/>
        <rect x="1" y="1" width="6" height="1"/>
        <rect x="1" y="2" width="1" height="2"/>
        <rect x="3" y="2" width="2" height="2"/>
        <rect x="6" y="2" width="1" height="2"/>
        <rect x="1" y="4" width="6" height="1"/>
        <rect x="0" y="5" width="1" height="2"/>
        <rect x="2" y="5" width="4" height="2"/>
        <rect x="7" y="5" width="1" height="2"/>
        <rect x="2" y="7" width="1" height="1"/>
        <rect x="5" y="7" width="1" height="1"/>
      </g>
    </svg>
    <span class="title">Usage</span>
  </div>

  <div class="cards">

    <div class="card">
      <div class="card-header">
        <span class="pct" id="current-pct">--</span>
        <span class="badge">Current</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="current-bar"></div>
      </div>
      <div class="countdown" id="current-countdown">--</div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="pct" id="weekly-pct">--</span>
        <span class="badge">Weekly</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="weekly-bar"></div>
      </div>
      <div class="countdown" id="weekly-countdown">--</div>
      <div class="sub-bars" id="sub-bars">
        <div class="sub-bar-row" id="opus-row">
          <span class="sub-bar-label">Opus</span>
          <div class="sub-bar-track">
            <div class="sub-bar-fill" id="opus-fill"></div>
          </div>
          <span class="sub-bar-pct" id="opus-pct"></span>
        </div>
        <div class="sub-bar-row" id="sonnet-row">
          <span class="sub-bar-label">Sonnet</span>
          <div class="sub-bar-track">
            <div class="sub-bar-fill" id="sonnet-fill"></div>
          </div>
          <span class="sub-bar-pct" id="sonnet-pct"></span>
        </div>
      </div>
    </div>

  </div>

  <div class="status-bar">
    <span class="status-text">* Active</span>
  </div>

  <script>
    'use strict';

    let usageData = null;

    function getColor(pct) {
      if (pct < 50) return '#22c55e';
      if (pct <= 80) return '#eab308';
      return '#ef4444';
    }

    function formatCountdown(isoString) {
      const diff = new Date(isoString) - Date.now();
      if (diff <= 0) return 'Resetting...';
      const totalSec = Math.floor(diff / 1000);
      const days    = Math.floor(totalSec / 86400);
      const hours   = Math.floor((totalSec % 86400) / 3600);
      const mins    = Math.floor((totalSec % 3600) / 60);
      const secs    = totalSec % 60;
      if (days  > 0) return `Resets in ${days}d ${hours}h`;
      if (hours > 0) return `Resets in ${hours}h ${mins}m`;
      return `Resets in ${mins}m ${secs}s`;
    }

    function applyBar(fillId, pctId, utilization) {
      const pct   = Math.round(Math.max(0, Math.min(100, utilization)));
      const color = getColor(pct);
      document.getElementById(fillId).style.width      = pct + '%';
      document.getElementById(fillId).style.background = color;
      if (pctId) {
        document.getElementById(pctId).textContent   = pct + '%';
        document.getElementById(pctId).style.color   = color;
      }
    }

    function render(data) {
      if (!data.five_hour || !data.seven_day) return;
      usageData = data;

      applyBar('current-bar', 'current-pct', data.five_hour.utilization);
      applyBar('weekly-bar',  'weekly-pct',  data.seven_day.utilization);

      const hasOpus   = data.seven_day_opus   !== null;
      const hasSonnet = data.seven_day_sonnet !== null;
      const hasAny    = hasOpus || hasSonnet;

      document.getElementById('sub-bars').style.display   = hasAny    ? 'flex' : 'none';
      document.getElementById('opus-row').style.display   = hasOpus   ? 'flex' : 'none';
      document.getElementById('sonnet-row').style.display = hasSonnet ? 'flex' : 'none';

      if (hasOpus)   applyBar('opus-fill',   'opus-pct',   data.seven_day_opus.utilization);
      if (hasSonnet) applyBar('sonnet-fill', 'sonnet-pct', data.seven_day_sonnet.utilization);

      tick();
    }

    function tick() {
      if (!usageData) return;
      document.getElementById('current-countdown').textContent =
        formatCountdown(usageData.five_hour.resets_at);
      document.getElementById('weekly-countdown').textContent =
        formatCountdown(usageData.seven_day.resets_at);
    }

    async function fetchAndRender() {
      try {
        const res  = await fetch('/usage');
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error('Failed to fetch /usage:', e);
      }
    }

    fetchAndRender();
    setInterval(fetchAndRender, 30_000);
    setInterval(tick, 1_000);
  </script>
</body>
</html>
