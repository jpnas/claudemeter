<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=480, user-scalable=no" />
    <title>Claudemeter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400&family=Pixelify+Sans:wght@600;700&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background: #0d0d0d;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        color: #faf9f5;
        font-family: "DM Sans", system-ui, sans-serif;
        width: min(800px, 100%);
        height: 480px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 16px 28px 12px;
        gap: 10px;
        flex-shrink: 0;
        justify-content: center;
        position: relative;
        touch-action: none;
        user-select: none;
        overscroll-behavior: none;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        height: 60px;
        gap: 12px;
      }

      .logo {
        display: block;
        width: 60px;
        height: 60px;
        flex-shrink: 0;
        border: none;
        background: transparent;
      }

      .title {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 44px;
        font-weight: 400;
        letter-spacing: 1px;
        line-height: 1;
        color: #faf9f5;
      }

      /* ── Cards ── */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        background: #1f1f1e;
        border-radius: 8px;
        padding: 12px 16px 12px;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0;
        position: relative;
      }

      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      /* % label — DM Sans bold (matches font_styrene_48) */
      .pct {
        font-family: "DM Sans", sans-serif;
        font-size: 52px;
        font-weight: 700;
        line-height: 1;
        color: #faf9f5;
        min-width: 0;
        overflow: hidden;
      }

      /* Pill — background matches bar track (#2a2a28), font_styrene_28 ≈ 20px */
      .badge {
        background: #2a2a28;
        border-radius: 999px;
        padding: 6px 18px;
        font-family: "DM Sans", sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: #faf9f5;
        flex-shrink: 0;
      }

      /* ── Progress bars — height 24px matching firmware ── */
      .progress-track {
        background: #2a2a28;
        border-radius: 6px;
        height: 24px;
        overflow: hidden;
        flex-shrink: 0;
        margin-bottom: 8px;
      }

      .progress-fill {
        height: 100%;
        border-radius: 6px;
        width: 0%;
        transition:
          width 0.7s ease,
          background-color 0.7s ease;
      }

      /* Resets in — font_styrene_28 ≈ 20px, COL_DIM */
      .countdown {
        font-family: "DM Sans", sans-serif;
        font-size: 20px;
        font-weight: 400;
        color: #b0aea5;
      }

      /* ── Sub-bars (Opus / Sonnet) ── */
      .sub-bars {
        display: none;
        flex-direction: column;
        gap: 5px;
        margin-top: 6px;
      }

      .sub-bar-row {
        display: none;
        align-items: center;
        gap: 8px;
      }

      .sub-bar-label {
        font-size: 13px;
        width: 52px;
        color: #b0aea5;
        flex-shrink: 0;
      }

      .sub-bar-track {
        background: #2a2a28;
        border-radius: 4px;
        height: 10px;
        flex: 1;
        overflow: hidden;
      }

      .sub-bar-fill {
        height: 100%;
        border-radius: 4px;
        width: 0%;
        transition: width 0.7s ease;
      }

      .sub-bar-pct {
        font-size: 13px;
        width: 36px;
        text-align: right;
        color: #b0aea5;
        flex-shrink: 0;
      }

      /* ── Error panel ── */
      #error-panel {
        display: none;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        padding: 20px 8px;
        position: relative;
        overflow: hidden;
        gap: 10px;
      }

      #error-panel.visible {
        display: flex;
      }

      #error-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0px,
          transparent 3px,
          rgba(255, 255, 255, 0.012) 3px,
          rgba(255, 255, 255, 0.012) 4px
        );
        pointer-events: none;
      }

      .err-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        font-family: "DM Mono", "Courier New", monospace;
      }

      .err-tag {
        font-size: 10px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        flex-shrink: 0;
        width: 42px;
        text-align: right;
      }

      .err-tag-err {
        color: #c0392b;
      }
      .err-tag-dim {
        color: #3a3935;
      }
      .err-tag-wait {
        color: #d97757;
      }

      .err-msg {
        font-size: 15px;
        color: #faf9f5;
        letter-spacing: 0.2px;
      }

      .err-hint {
        font-size: 12px;
        color: #4a4945;
        letter-spacing: 0.2px;
      }

      .err-retry {
        font-size: 14px;
        color: #7a7970;
        letter-spacing: 0.5px;
      }

      .err-retry em {
        font-style: normal;
        color: #b0aea5;
      }

      @keyframes err-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      .err-cursor {
        display: inline-block;
        width: 6px;
        height: 0.85em;
        background: #d97757;
        vertical-align: -1px;
        margin-left: 3px;
        animation: err-blink 1s step-end infinite;
      }

      /* ── Status bar — font_mono_32, COL_ACCENT ── */
      .status-bar {
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-text {
        font-family: "DM Mono", "Courier New", monospace;
        color: #d97757;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 1px;
        display: inline-flex;
        align-items: center;
        line-height: 1.4;
      }

      /* Fixed-size slot so the spinner glyph can't shift the verb. The
         glyphs (· ✻ ✽ …) come from per-glyph font fallback whose advance
         width AND line metrics differ (esp. on Windows), which otherwise
         jittered the verb horizontally (width) and vertically (height).
         A fixed box + flex centering + overflow:hidden decouples the
         glyph's metrics from the row entirely. */
      .spinner-glyph {
        flex: 0 0 1.6em;
        height: 1.4em;
        margin-right: 0.25em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        overflow: hidden;
      }

      /* ── Screen switch button ── */
      .nav-btn {
        position: absolute;
        top: 16px;
        right: 28px;
        z-index: 10;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: #2a2a28;
        border: none;
        color: #faf9f5;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .nav-btn svg {
        width: 24px;
        height: 24px;
      }

      .nav-btn:active {
        background: #3a3935;
      }

      /* ── Player ── */
      #player-screen {
        position: absolute;
        inset: 0;
        background: #141312 radial-gradient(#23211e 1px, transparent 1px) 0 0 / 8px 8px;
        overflow: hidden;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        font-family: "Silkscreen", monospace;
        color: #eee7d7;
      }

      #player-screen.active {
        transform: none;
      }

      .deck {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 800px;
        height: 480px;
        transform: translate(-50%, -50%) scale(var(--deck-scale, 1));
      }

      .disc {
        position: absolute;
        left: 29px;
        top: 29px;
        width: 280px;
        height: 280px;
        image-rendering: pixelated;
      }

      .tonearm {
        position: absolute;
        left: 296px;
        top: 42px;
        transform-origin: 0 0;
        transform: rotate(-32deg);
        transition: transform 0.9s ease-in-out;
      }

      .tonearm.on {
        transform: none;
      }

      .tonearm div {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #cfc8ba;
      }

      .tonearm .headshell {
        left: -30px;
        top: 82px;
        width: 16px;
        height: 18px;
        border-bottom: 4px solid #6f6a62;
      }

      .pivot {
        position: absolute;
        left: 285px;
        top: 31px;
        width: 22px;
        height: 22px;
        background: #6f6a62;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pivot::after {
        content: "";
        width: 8px;
        height: 8px;
        background: #201e1b;
      }

      .info {
        position: absolute;
        left: 348px;
        top: 24px;
        width: 428px;
        height: 290px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .play-state {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 22px;
        font-size: 18px;
        letter-spacing: 1px;
        color: #ff7a2f;
      }

      .play-state.paused {
        color: #a39c8f;
      }

      .play-state svg {
        width: 12px;
        height: 14px;
      }

      .track {
        font-family: "Pixelify Sans", monospace;
        font-weight: 700;
        font-size: 60px;
        line-height: 1.05;
        margin-top: 10px;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .artist {
        font-family: "Pixelify Sans", monospace;
        font-weight: 600;
        font-size: 30px;
        color: #ff7a2f;
        margin-top: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .album {
        font-size: 20px;
        color: #a39c8f;
        margin-top: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #player-screen.idle .track {
        font-size: 44px;
      }

      #player-screen.idle .artist {
        font-family: "Silkscreen", monospace;
        font-weight: 400;
        font-size: 20px;
        color: #a39c8f;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .progress {
        position: absolute;
        left: 24px;
        top: 326px;
        width: 752px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .times {
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        color: #a39c8f;
      }

      .seek {
        position: relative;
        height: 22px;
        border: 3px solid #3a3631;
        padding: 3px;
        cursor: pointer;
        touch-action: none;
      }

      .seek::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -16px;
        bottom: -16px;
      }

      .seek-fill {
        width: 0%;
        height: 100%;
        background: #ff7a2f;
      }

      .controls {
        position: absolute;
        left: 24px;
        top: 398px;
        width: 752px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      #player-screen.idle .controls,
      #player-screen.idle .progress {
        opacity: 0.35;
        pointer-events: none;
      }

      .ctl {
        background: none;
        border: none;
        color: #eee7d7;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 88px;
        height: 72px;
      }

      .ctl svg {
        width: 52px;
        height: 40px;
      }

      .ctl.play svg {
        width: 44px;
        height: 44px;
      }

      .ctl.toggle {
        position: relative;
        width: 72px;
        color: #6f6a62;
      }

      .ctl.toggle svg {
        width: 36px;
        height: 27px;
      }

      .ctl.toggle::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
      }

      .ctl.toggle.on {
        color: #ff7a2f;
      }

      .ctl.toggle.on::after {
        background: #ff7a2f;
      }

      .ctl .icon-repeat-one {
        display: none;
      }

      .ctl.repeat-one .icon-repeat-one {
        display: block;
      }

      .ctl.repeat-one .icon-repeat {
        display: none;
      }

      .ctl .icon-smart {
        display: none;
      }

      .ctl.smart .icon-smart {
        display: block;
        width: 45px;
      }

      .ctl.smart .icon-shuffle {
        display: none;
      }

      .player-msg {
        position: absolute;
        left: 24px;
        right: 100px;
        top: 6px;
        text-align: center;
        font-size: 14px;
        color: #ff7a2f;
        letter-spacing: 0.5px;
      }

      /* ── Mini screen overrides (≤ 800×480 physical display) ── */
            .mini body {
        height: 100vh;
        width: 100vw;
        padding: 0px 40px;
        gap: 0px;
      }

      .mini .header {
        height: 80px;
        gap: 14px;
      }

      .mini .logo {
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
      }

      .mini .title {
        margin-bottom: 36px;
        margin-left: 8px;
        font-size: 64px;
      }

      .mini .cards {
        gap: 18px;
      }

      .mini .card {
        padding: 16px 24px;
      }

      .mini .card-header {
        margin-bottom: 10px;
        align-items: center;
        margin-bottom: 18px;
      }

      .mini .pct {
        font-size: 55px;
      }

      .mini .badge {
        font-size: 32px;
        padding: 10px 22px;
      }

      .mini .progress-track {
        height: 24px;
        margin-bottom: 18px;
      }

      .mini .countdown {
        font-size: 40px;
        letter-spacing: 1.2px;
      }

      .mini .status-text {
        font-size: 32px;
        letter-spacing: 1.5px;
        margin-top: 22px;
      }

      .mini .nav-btn {
        top: 36px;
        right: 40px;
        width: 64px;
        height: 64px;
      }

      .mini .nav-btn svg {
        width: 32px;
        height: 32px;
      }

      .nav-btn.retro,
      .nav-btn.retro:active {
        padding: 0;
        border-radius: 0;
        background: transparent;
      }

      .nav-btn.retro svg {
        width: 100%;
        height: 100%;
      }

      .nav-btn.retro:active .frame {
        fill: #ff7a2f;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <video class="logo" id="sprite" autoplay loop muted playsinline></video>
      <span class="title">Usage</span>
    </div>

    <div class="cards">
      <div class="card" id="current-card">
        <div class="card-header">
          <span class="pct" id="current-pct">--%</span>
          <span class="badge">Current</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="current-bar"></div>
        </div>
        <div class="countdown" id="current-countdown">---</div>
      </div>

      <div class="card" id="weekly-card">
        <div class="card-header">
          <span class="pct" id="weekly-pct">--%</span>
          <span class="badge">Weekly</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="weekly-bar"></div>
        </div>
        <div class="countdown" id="weekly-countdown">---</div>
        <div class="sub-bars" id="sub-bars">
          <div class="sub-bar-row" id="opus-row">
            <span class="sub-bar-label">Opus</span>
            <div class="sub-bar-track">
              <div class="sub-bar-fill" id="opus-fill"></div>
            </div>
            <span class="sub-bar-pct" id="opus-pct"></span>
          </div>
          <div class="sub-bar-row" id="sonnet-row">
            <span class="sub-bar-label">Sonnet</span>
            <div class="sub-bar-track">
              <div class="sub-bar-fill" id="sonnet-fill"></div>
            </div>
            <span class="sub-bar-pct" id="sonnet-pct"></span>
          </div>
        </div>
      </div>

      <div id="error-panel">
        <div class="err-row">
          <span class="err-tag err-tag-err">err</span>
          <span class="err-msg" id="err-msg">—</span>
        </div>
        <div class="err-row" id="err-hint-row">
          <span class="err-tag err-tag-dim">—</span>
          <span class="err-hint" id="err-hint"></span>
        </div>
        <div class="err-row" style="margin-top: 6px">
          <span class="err-tag err-tag-wait">wait</span>
          <span class="err-retry"
            >retrying in <em id="err-countdown">30</em>s<span
              class="err-cursor"
            ></span
          ></span>
        </div>
      </div>

      <div class="status-bar">
        <span class="status-text" id="status-text"><span class="spinner-glyph" id="status-icon"></span><span id="status-verb"></span></span>
      </div>
    </div>

    <div id="player-screen">
      <div class="deck" id="deck">
        <canvas class="disc" id="disc" width="56" height="56"></canvas>
        <div class="tonearm" id="tonearm"><div class="headshell"></div></div>
        <div class="pivot"></div>

        <div class="info">
          <div class="play-state" id="play-state"></div>
          <div class="track" id="player-track"></div>
          <div class="artist" id="player-artist"></div>
          <div class="album" id="player-album"></div>
        </div>

        <div class="progress">
          <div class="times"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>
          <div class="seek" id="seek">
            <div class="seek-fill" id="seek-fill"></div>
          </div>
        </div>

        <div class="controls">
          <button class="ctl toggle" id="shuffle-btn">
            <svg class="icon-shuffle" viewBox="0 0 12 9" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="1" width="3" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="7" y="6" width="3" height="1"/><rect x="9" y="5" width="1" height="3"/><rect x="10" y="6" width="1" height="1"/><rect x="0" y="6" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="7" y="1" width="3" height="1"/><rect x="9" y="0" width="1" height="3"/><rect x="10" y="1" width="1" height="1"/></svg>
            <svg class="icon-smart" viewBox="0 0 15 9" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="1" width="3" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="7" y="6" width="3" height="1"/><rect x="9" y="5" width="1" height="3"/><rect x="10" y="6" width="1" height="1"/><rect x="0" y="6" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="7" y="1" width="3" height="1"/><rect x="9" y="0" width="1" height="3"/><rect x="10" y="1" width="1" height="1"/><rect x="13" y="0" width="1" height="3"/><rect x="12" y="1" width="3" height="1"/></svg>
          </button>
          <button class="ctl" id="prev-btn">
            <svg viewBox="0 0 13 10" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="0" width="2" height="10"/><rect x="3" y="4" width="2" height="2"/><rect x="5" y="3" width="2" height="4"/><rect x="7" y="2" width="2" height="6"/><rect x="9" y="1" width="2" height="8"/><rect x="11" y="0" width="2" height="10"/></svg>
          </button>
          <button class="ctl play" id="play-btn"></button>
          <button class="ctl" id="next-btn">
            <svg viewBox="0 0 13 10" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="0" width="2" height="10"/><rect x="2" y="1" width="2" height="8"/><rect x="4" y="2" width="2" height="6"/><rect x="6" y="3" width="2" height="4"/><rect x="8" y="4" width="2" height="2"/><rect x="11" y="0" width="2" height="10"/></svg>
          </button>
          <button class="ctl toggle" id="repeat-btn">

          } while (next === phraseIdx);

      function formatCountdown(isoString) {
        const diff = new Date(isoString) - Date.now();
        if (diff <= 0) return "Resetting…";
        const totalSec = Math.floor(diff / 1000);
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400) / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        if (days > 0) return `Resets in ${days}d ${hours}h`;
        if (hours > 0) return `Resets in ${hours}h ${mins}m`;
        return `Resets in ${mins}m ${secs}s`;
      }

        const pct = Math.round(Math.max(0, Math.min(100, utilization)));

        document.getElementById(fillId).style.background = color;
        if (pctId) {
          document.getElementById(pctId).textContent = pct + "%";
        }

          document.getElementById("current-pct").textContent = "100%";

          setSprite(SPRITE_BASE + SPRITES[spriteIdx]);

          "#d97757",

        applyBar("weekly-bar", "weekly-pct", data.seven_day.utilization);

        const hasSonnet = data.seven_day_sonnet !== null;
        const hasAny = hasOpus || hasSonnet;

        document.getElementById("sub-bars").style.display = hasAny

          data.seven_day.utilization >= 100 ||
          (hasOpus && data.seven_day_opus.utilization >= 100) ||
          (hasSonnet && data.seven_day_sonnet.utilization >= 100);

      const DISC_SIZE = 56;
      const DISC_FRAMES = 32;
      const COVER_SIZE = 64;
      const DISC_RIM = [14, 13, 18];
      const DISC_HOLE = [32, 30, 27];
      const DISC_LABEL = [46, 43, 39];
      const DISC_GROOVES = [
        [38, 37, 49],
        [23, 22, 29],
      ];

      const discCtx = document.getElementById("disc").getContext("2d");
      let discFrame = 0;
      let coverUrl = null;
      let coverPixels = null;

      function drawDisc() {
        const n = DISC_SIZE;
        const c = (n - 1) / 2;
        const r = n / 2;
        const labelR = r * 0.62;
        const angle = (-discFrame * Math.PI * 2) / DISC_FRAMES;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const image = discCtx.createImageData(n, n);

        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            const dx = x - c;
            const dy = y - c;
            const d = Math.hypot(dx, dy);
            if (d > r - 0.2) continue;

            let rgb;
            if (d > r - 1.4) rgb = DISC_RIM;
            else if (d < 1.4) rgb = DISC_HOLE;
            else if (d < labelR) {
              if (d > labelR - 1) rgb = DISC_RIM;
              else if (!coverPixels) rgb = DISC_LABEL;
              else {
                const rx = dx * cos - dy * sin;
                const ry = dx * sin + dy * cos;
                const u = Math.min(COVER_SIZE - 1, Math.max(0, Math.floor(((rx / labelR + 1) / 2) * COVER_SIZE)));
                const v = Math.min(COVER_SIZE - 1, Math.max(0, Math.floor(((ry / labelR + 1) / 2) * COVER_SIZE)));
                const i = (v * COVER_SIZE + u) * 4;
                rgb = [coverPixels[i], coverPixels[i + 1], coverPixels[i + 2]];
              }
            } else rgb = DISC_GROOVES[Math.floor(d) % 2];

            if (d >= labelR + 1 && d <= r - 2) {
              const deg = (Math.atan2(dy, dx) * 180) / Math.PI;
              if (Math.abs(deg + 45) < 7 || Math.abs(deg - 135) < 7) {
                rgb = rgb.map((value) => value + (255 - value) * 0.12);
              }
            }

            const o = (y * n + x) * 4;
            image.data[o] = rgb[0];
            image.data[o + 1] = rgb[1];
            image.data[o + 2] = rgb[2];
            image.data[o + 3] = 255;
          }
        }

        discCtx.putImageData(image, 0, 0);
      }

      function loadCover(url) {
        if (url === coverUrl) return;
        coverUrl = url;
        coverPixels = null;
        drawDisc();
        if (!url) return;

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          if (url !== coverUrl) return;
          const canvas = document.createElement("canvas");
          canvas.width = COVER_SIZE;
          canvas.height = COVER_SIZE;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, COVER_SIZE, COVER_SIZE);
          coverPixels = ctx.getImageData(0, 0, COVER_SIZE, COVER_SIZE).data;
          drawDisc();
        };
        img.src = url;
      }

      for (let i = 0; i <= 14; i++) {

      function renderPlayer(data) {
        const screen = document.getElementById("player-screen");
        const hasTrack = data.connected && data.track;
        player = hasTrack ? data : null;
        screen.classList.toggle("idle", !hasTrack);

        if (!data.connected) {
          document.getElementById("player-track").textContent =
            "Spotify not connected";
          document.getElementById("player-artist").textContent =
            "Open 127.0.0.1:3333/spotify/login";
          document.getElementById("player-album").textContent = "";
        } else if (!data.track) {
          document.getElementById("player-track").textContent =
            "Nothing playing";
          document.getElementById("player-artist").textContent = "";
          document.getElementById("player-album").textContent = "";
        } else {
          document.getElementById("player-track").textContent = data.track;
          document.getElementById("player-artist").textContent = data.artist;
          document.getElementById("player-album").textContent = data.album;

        loadCover(hasTrack ? data.image : null);
        renderPlayState();

        const shuffleBtn = document.getElementById("shuffle-btn");
        shuffleBtn.classList.toggle("on", !!(data.shuffle || data.smart_shuffle));
        shuffleBtn.classList.toggle("smart", !!data.smart_shuffle);

        const repeatBtn = document.getElementById("repeat-btn");
        repeatBtn.classList.toggle(
          "on",
          data.repeat === "context" || data.repeat === "track",
        );
        repeatBtn.classList.toggle("repeat-one", data.repeat === "track");

        if (!seeking) renderSeek();
      }

      async function fetchPlayer() {
        try {
          const res = await fetch("/spotify/state");
          const data = await res.json();
          if (!res.ok) {
            showPlayerMsg(data.message || `HTTP ${res.status}`);
            return;
          }
          renderPlayer(data);
        } catch (e) {
          showPlayerMsg(e.message || "fetch error");
        }
      }

      async function sendCommand(command, value) {
        const query =
          value === undefined ? "" : `?value=${encodeURIComponent(value)}`;
        try {
          const res = await fetch(`/spotify/${command}${query}`, {
            method: "POST",
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            showPlayerMsg(body.message || `HTTP ${res.status}`);
          }
        } catch (e) {
          showPlayerMsg(e.message || "fetch error");
        }
        setTimeout(fetchPlayer, 400);
      }

      document.getElementById("play-btn").addEventListener("click", () => {
        if (!player) return;
        player.is_playing = !player.is_playing;
        renderPlayState();
        sendCommand(player.is_playing ? "play" : "pause");
      });

      document
        .getElementById("prev-btn")
        .addEventListener("click", () => sendCommand("previous"));
      document
        .getElementById("next-btn")
        .addEventListener("click", () => sendCommand("next"));

      document.getElementById("shuffle-btn").addEventListener("click", () => {
        if (!player) return;
        sendCommand("shuffle", !(player.shuffle || player.smart_shuffle));
      });

      const REPEAT_NEXT = { off: "context", context: "track", track: "off" };
      document.getElementById("repeat-btn").addEventListener("click", () => {
        if (!player) return;
        sendCommand("repeat", REPEAT_NEXT[player.repeat] ?? "off");
      });

      const seekBar = document.getElementById("seek");
      function seekTo(ev) {
        const r = seekBar.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
        player.progress_ms = ratio * player.duration_ms;
        renderSeek();
      }
      seekBar.addEventListener("pointerdown", (ev) => {
        if (!player) return;
        seeking = true;
        seekBar.setPointerCapture(ev.pointerId);
        seekTo(ev);
      });
      seekBar.addEventListener("pointermove", (ev) => seeking && seekTo(ev));
      seekBar.addEventListener("pointerup", (ev) => {
        if (!seeking) return;
        seeking = false;
        if (!player) return;
        seekTo(ev);
        sendCommand("seek", player.progress_ms);
      });

      setInterval(() => {
        if (!playerVisible || !player?.is_playing || seeking) return;
        player.progress_ms = Math.min(
          player.duration_ms,
          player.progress_ms + 1000,
        );
        renderSeek();
      }, 1000);

      setInterval(() => {
        if (playerVisible) fetchPlayer();
      }, 3000);

      setInterval(() => {
        if (!playerVisible || !player?.is_playing) return;
        discFrame = (discFrame + 1) % DISC_FRAMES;
        drawDisc();
      }, 150);

      renderNav();
      renderPlayState();
      drawDisc();

      fetchAndRender();
      setInterval(fetchAndRender, 30_000);
      setInterval(tickTime, 1_000);
      setInterval(tickSpinner, 50); // check every 50ms, fire based on per-frame ms
    </script>
  </body>
</html>
