<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=480, user-scalable=no" />
    <title>Claudemeter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background: #0d0d0d;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        color: #faf9f5;
        font-family: "DM Sans", system-ui, sans-serif;
        width: min(800px, 100%);
        height: 480px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 16px 28px 12px;
        gap: 10px;
        flex-shrink: 0;
        justify-content: center;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        height: 60px;
        gap: 12px;
      }

      .logo {
        display: block;
        width: 60px;
        height: 60px;
        flex-shrink: 0;
        border: none;
        background: transparent;
      }

      .title {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 44px;
        font-weight: 400;
        letter-spacing: 1px;
        line-height: 1;
        color: #faf9f5;
      }

      /* ── Cards ── */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        background: #1f1f1e;
        border-radius: 8px;
        padding: 12px 16px 12px;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0;
        position: relative;
      }

      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      /* % label — DM Sans bold (matches font_styrene_48) */
      .pct {
        font-family: "DM Sans", sans-serif;
        font-size: 52px;
        font-weight: 700;
        line-height: 1;
        color: #faf9f5;
        min-width: 0;
        overflow: hidden;
      }

      /* Pill — background matches bar track (#2a2a28), font_styrene_28 ≈ 20px */
      .badge {
        background: #2a2a28;
        border-radius: 999px;
        padding: 6px 18px;
        font-family: "DM Sans", sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: #faf9f5;
        flex-shrink: 0;
      }

      /* ── Progress bars — height 24px matching firmware ── */
      .progress-track {
        background: #2a2a28;
        border-radius: 6px;
        height: 24px;
        overflow: hidden;
        flex-shrink: 0;
        margin-bottom: 8px;
      }

      .progress-fill {
        height: 100%;
        border-radius: 6px;
        width: 0%;
        transition:
          width 0.7s ease,
          background-color 0.7s ease;
      }

      /* Resets in — font_styrene_28 ≈ 20px, COL_DIM */
      .countdown {
        font-family: "DM Sans", sans-serif;
        font-size: 20px;
        font-weight: 400;
        color: #b0aea5;
      }

      /* ── Sub-bars (Opus / Sonnet) ── */
      .sub-bars {
        display: none;
        flex-direction: column;
        gap: 5px;
        margin-top: 6px;
      }

      .sub-bar-row {
        display: none;
        align-items: center;
        gap: 8px;
      }

      .sub-bar-label {
        font-size: 13px;
        width: 52px;
        color: #b0aea5;
        flex-shrink: 0;
      }

      .sub-bar-track {
        background: #2a2a28;
        border-radius: 4px;
        height: 10px;
        flex: 1;
        overflow: hidden;
      }

      .sub-bar-fill {
        height: 100%;
        border-radius: 4px;
        width: 0%;
        transition: width 0.7s ease;
      }

      .sub-bar-pct {
        font-size: 13px;
        width: 36px;
        text-align: right;
        color: #b0aea5;
        flex-shrink: 0;
      }

      /* ── Error panel ── */
      #error-panel {
        display: none;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        padding: 20px 8px;
        position: relative;
        overflow: hidden;
        gap: 10px;
      }

      #error-panel.visible {
        display: flex;
      }

      #error-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0px,
          transparent 3px,
          rgba(255, 255, 255, 0.012) 3px,
          rgba(255, 255, 255, 0.012) 4px
        );
        pointer-events: none;
      }

      .err-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        font-family: "DM Mono", "Courier New", monospace;
      }

      .err-tag {
        font-size: 10px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        flex-shrink: 0;
        width: 42px;
        text-align: right;
      }

      .err-tag-err {
        color: #c0392b;
      }
      .err-tag-dim {
        color: #3a3935;
      }
      .err-tag-wait {
        color: #d97757;
      }

      .err-msg {
        font-size: 15px;
        color: #faf9f5;
        letter-spacing: 0.2px;
      }

      .err-hint {
        font-size: 12px;
        color: #4a4945;
        letter-spacing: 0.2px;
      }

      .err-retry {
        font-size: 14px;
        color: #7a7970;
        letter-spacing: 0.5px;
      }

      .err-retry em {
        font-style: normal;
        color: #b0aea5;
      }

      @keyframes err-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      .err-cursor {
        display: inline-block;
        width: 6px;
        height: 0.85em;
        background: #d97757;
        vertical-align: -1px;
        margin-left: 3px;
        animation: err-blink 1s step-end infinite;
      }

      /* ── Status bar — font_mono_32, COL_ACCENT ── */
      .status-bar {
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-text {
        font-family: "DM Mono", "Courier New", monospace;
        color: #d97757;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 1px;
        display: inline-flex;
        align-items: center;
        line-height: 1.4;
      }

      /* Fixed-size slot so the spinner glyph can't shift the verb. The
         glyphs (· ✻ ✽ …) come from per-glyph font fallback whose advance
         width AND line metrics differ (esp. on Windows), which otherwise
         jittered the verb horizontally (width) and vertically (height).
         A fixed box + flex centering + overflow:hidden decouples the
         glyph's metrics from the row entirely. */
      .spinner-glyph {
        flex: 0 0 1.6em;
        height: 1.4em;
        margin-right: 0.25em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        overflow: hidden;
      }

      /* ── Mini screen overrides (≤ 800×480 physical display) ── */
            .mini body {
        height: 100vh;
        width: 100vw;
        padding: 0px 40px;
        gap: 0px;
      }

      .mini .header {
        height: 80px;
        gap: 14px;
      }

      .mini .logo {
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
      }

      .mini .title {
        margin-bottom: 36px;
        margin-left: 8px;
        font-size: 64px;
      }

      .mini .cards {
        gap: 18px;
      }

      .mini .card {
        padding: 16px 24px;
      }

      .mini .card-header {
        margin-bottom: 10px;
        align-items: center;
        margin-bottom: 18px;
      }

      .mini .pct {
        font-size: 55px;
      }

      .mini .badge {
        font-size: 32px;
        padding: 10px 22px;
      }

      .mini .progress-track {
        height: 24px;
        margin-bottom: 18px;
      }

      .mini .countdown {
        font-size: 40px;
        letter-spacing: 1.2px;
      }

      .mini .status-text {
        font-size: 32px;
        letter-spacing: 1.5px;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <video class="logo" id="sprite" autoplay loop muted playsinline></video>
      <span class="title">Usage</span>
    </div>

    <div class="cards">
      <div class="card" id="current-card">
        <div class="card-header">
          <span class="pct" id="current-pct">--%</span>
          <span class="badge">Current</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="current-bar"></div>
        </div>
        <div class="countdown" id="current-countdown">---</div>
      </div>

      <div class="card" id="weekly-card">
        <div class="card-header">
          <span class="pct" id="weekly-pct">--%</span>
          <span class="badge">Weekly</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="weekly-bar"></div>
        </div>
        <div class="countdown" id="weekly-countdown">---</div>
        <div class="sub-bars" id="sub-bars">
          <div class="sub-bar-row" id="opus-row">
            <span class="sub-bar-label">Opus</span>
            <div class="sub-bar-track">
              <div class="sub-bar-fill" id="opus-fill"></div>
            </div>
            <span class="sub-bar-pct" id="opus-pct"></span>
          </div>
          <div class="sub-bar-row" id="sonnet-row">
            <span class="sub-bar-label">Sonnet</span>
            <div class="sub-bar-track">
              <div class="sub-bar-fill" id="sonnet-fill"></div>
            </div>
            <span class="sub-bar-pct" id="sonnet-pct"></span>
          </div>
        </div>
      </div>

      <div id="error-panel">
        <div class="err-row">
          <span class="err-tag err-tag-err">err</span>
          <span class="err-msg" id="err-msg">—</span>
        </div>
        <div class="err-row" id="err-hint-row">
          <span class="err-tag err-tag-dim">—</span>
          <span class="err-hint" id="err-hint"></span>
        </div>
        <div class="err-row" style="margin-top: 6px">
          <span class="err-tag err-tag-wait">wait</span>
          <span class="err-retry"
            >retrying in <em id="err-countdown">30</em>s<span
              class="err-cursor"
            ></span
          ></span>
        </div>
      </div>

      <div class="status-bar">
        <span class="status-text" id="status-text"><span class="spinner-glyph" id="status-icon"></span><span id="status-verb"></span></span>
      </div>
    </div>

    <script>
      "use strict";

      /* ── Mini-screen detection ── */
      if (window.screen.width <= 960 && window.screen.height <= 640) {
        document.documentElement.classList.add("mini");
      }

      /* ── Sprites ── */
      const SPRITE_BASE = "/sprites/";
      const SPRITES = [
        "idle_breathe.mp4",
        "idle_blink.mp4",
        "idle_look_around.mp4",
        "expression_wink.mp4",
        "expression_surprise.mp4",
        "dance_bounce.mp4",
        "dance_sway.mp4",
        "dance_bounce_dj.mp4",
        "dance_sway_dj.mp4",
        "dance_djmix.mp4",
        "work_coding.mp4",
        "work_think.mp4",
      ];
      let spriteIdx = Math.floor(Math.random() * SPRITES.length);
      let spritesPaused = false;

      function setSprite(src) {
        const el = document.getElementById("sprite");
        el.src = src;
        el.load();
        el.play().catch(() => {});
      }

      function nextSprite() {
        if (spritesPaused) return;
        let next;
        do { next = Math.floor(Math.random() * SPRITES.length); } while (next === spriteIdx);
        spriteIdx = next;
        setSprite(SPRITE_BASE + SPRITES[spriteIdx]);
      }
      setSprite(SPRITE_BASE + SPRITES[spriteIdx]);
      setInterval(nextSprite, 15 * 1000);

      /* ── Spinner: exact Clawdmeter ping-pong sequence ── */
      const SPINNER_FRAMES = ["·", "✻", "✽", "✶", "✳", "✢"];
      const SPINNER_MS = [260, 130, 130, 130, 130, 260];
      const SPINNER_COUNT = SPINNER_FRAMES.length; // 6
      const SPINNER_PHASES = 2 * (SPINNER_COUNT - 1); // 10

      /* ── Status phrases (full Clawdmeter list) ── */
      const PHRASES = [
        "Accomplishing",
        "Actioning",
        "Actualizing",
        "Architecting",
        "Baking",
        "Beaming",
        "Beboppin'",
        "Befuddling",
        "Billowing",
        "Blanching",
        "Bloviating",
        "Boogieing",
        "Boondoggling",
        "Booping",
        "Bootstrapping",
        "Brewing",
        "Bunning",
        "Burrowing",
        "Calculating",
        "Canoodling",
        "Caramelizing",
        "Cascading",
        "Catapulting",
        "Cerebrating",
        "Channeling",
        "Channelling",
        "Choreographing",
        "Churning",
        "Clauding",
        "Coalescing",
        "Cogitating",
        "Combobulating",
        "Composing",
        "Computing",
        "Concocting",
        "Considering",
        "Contemplating",
        "Cooking",
        "Crafting",
        "Creating",
        "Crunching",
        "Crystallizing",
        "Cultivating",
        "Deciphering",
        "Deliberating",
        "Determining",
        "Dilly-dallying",
        "Discombobulating",
        "Doing",
        "Doodling",
        "Drizzling",
        "Ebbing",
        "Effecting",
        "Elucidating",
        "Embellishing",
        "Enchanting",
        "Envisioning",
        "Evaporating",
        "Fermenting",
        "Fiddle-faddling",
        "Finagling",
        "Flambéing",
        "Flibbertigibbeting",
        "Flowing",
        "Flummoxing",
        "Fluttering",
        "Forging",
        "Forming",
        "Frolicking",
        "Frosting",
        "Gallivanting",
        "Galloping",
        "Garnishing",
        "Generating",
        "Gesticulating",
        "Germinating",
        "Gitifying",
        "Grooving",
        "Gusting",
        "Harmonizing",
        "Hashing",
        "Hatching",
        "Herding",
        "Honking",
        "Hullaballooing",
        "Hyperspacing",
        "Ideating",
        "Imagining",
        "Improvising",
        "Incubating",
        "Inferring",
        "Infusing",
        "Ionizing",
        "Jitterbugging",
        "Julienning",
        "Kneading",
        "Leavening",
        "Levitating",

        "Manifesting",

        "Metamorphosing",

        "Precipitating",

        "Processing",
        "Proofing",

        "Puttering",
        "Puzzling",
        "Quantumizing",
        "Razzle-dazzling",
        "Razzmatazzing",
        "Recombobulating",
        "Reticulating",
        "Roosting",
        "Ruminating",
        "Sautéing",
        "Scampering",
        "Schlepping",
        "Scurrying",
        "Seasoning",
        "Shenaniganing",
        "Shimmying",
        "Simmering",
        "Skedaddling",
        "Sketching",
        "Slithering",
        "Smooshing",
        "Sock-hopping",
        "Spelunking",
        "Spinning",
        "Sprouting",
        "Stewing",
        "Sublimating",
        "Swirling",
        "Swooping",
        "Symbioting",
        "Synthesizing",
        "Tempering",
        "Thinking",
        "Thundering",
        "Tinkering",
        "Tomfoolering",
        "Topsy-turvying",
        "Transfiguring",
        "Transmuting",
        "Twisting",
        "Undulating",
        "Unfurling",
        "Unravelling",
        "Vibing",
        "Waddling",
        "Wandering",
        "Warping",
        "Whatchamacalliting",
        "Whirlpooling",
        "Whirring",
        "Whisking",
        "Wibbling",
        "Working",
        "Wrangling",
        "Zesting",
        "Zigzagging",
      ];

      let spinnerPhase = 0;
      let spinnerIdx = 0;
      let phraseIdx = Math.floor(Math.random() * PHRASES.length);
      let lastSpinner = 0;
      let lastPhrase = 0;

      function tickSpinner() {
        const now = Date.now();

        if (now - lastPhrase >= 4000) {
          let next;
          do {
            next = Math.floor(Math.random() * PHRASES.length);
          } while (next === phraseIdx);
          phraseIdx = next;
          lastPhrase = now;
        }

        if (now - lastSpinner >= SPINNER_MS[spinnerIdx]) {
          lastSpinner = now;
          spinnerPhase = (spinnerPhase + 1) % SPINNER_PHASES;
          spinnerIdx =
            spinnerPhase < SPINNER_COUNT
              ? spinnerPhase
              : SPINNER_PHASES - spinnerPhase;
        }

        if (fetchError) return;
        const icon = document.getElementById("status-icon");
        if (isMaxed) {
          icon.textContent = "";
          icon.style.display = "none";
          document.getElementById("status-verb").textContent =
            "limit reached. claude is napping…";
          return;
        }
        icon.style.display = "";
        icon.textContent = SPINNER_FRAMES[spinnerIdx];
        document.getElementById("status-verb").textContent =
          PHRASES[phraseIdx] + "…";
      }

      /* ── Usage rendering ── */
      let usageData = null;
      let fetchError = false;
      let retryTimer = null;

      // Matches pct_color() in ui.cpp exactly
      function getColor(pct) {
        if (pct >= 80) return "#c0392b";
        if (pct >= 50) return "#d97757";
        return "#788c5d";
      }

      function formatCountdown(isoString) {
        const diff = new Date(isoString) - Date.now();
        if (diff <= 0) return "Resetting…";
        const totalSec = Math.floor(diff / 1000);
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400) / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        if (days > 0) return `Resets in ${days}d ${hours}h`;
        if (hours > 0) return `Resets in ${hours}h ${mins}m`;
        return `Resets in ${mins}m ${secs}s`;
      }

      function applyBar(fillId, pctId, utilization, fixedColor) {
        const pct = Math.round(Math.max(0, Math.min(100, utilization)));
        const color = fixedColor ?? getColor(pct);
        document.getElementById(fillId).style.width = pct + "%";
        document.getElementById(fillId).style.background = color;
        if (pctId) {
          document.getElementById(pctId).textContent = pct + "%";
        }
      }

      let isMaxed = false;

      function updateMaxedSprite(maxed) {
        if (maxed === isMaxed) return;
        isMaxed = maxed;
        if (maxed) {
          spritesPaused = true;
          setSprite(SPRITE_BASE + "expression_sleep.mp4");
          document.getElementById("current-bar").style.width = "100%";
          document.getElementById("current-pct").textContent = "100%";
        } else {
          spritesPaused = false;
          setSprite(SPRITE_BASE + SPRITES[spriteIdx]);
        }
      }

      function render(data) {
        if (!data.five_hour || !data.seven_day) return;
        usageData = data;

        applyBar(
          "current-bar",
          "current-pct",
          data.five_hour.utilization,
          "#d97757",
        );
        applyBar("weekly-bar", "weekly-pct", data.seven_day.utilization);

        const hasOpus = data.seven_day_opus !== null;
        const hasSonnet = data.seven_day_sonnet !== null;
        const hasAny = hasOpus || hasSonnet;

        document.getElementById("sub-bars").style.display = hasAny
          ? "flex"
          : "none";
        document.getElementById("opus-row").style.display = hasOpus
          ? "flex"
          : "none";
        document.getElementById("sonnet-row").style.display = hasSonnet
          ? "flex"
          : "none";

        if (hasOpus)
          applyBar("opus-fill", "opus-pct", data.seven_day_opus.utilization);
        if (hasSonnet)
          applyBar(
            "sonnet-fill",
            "sonnet-pct",
            data.seven_day_sonnet.utilization,
          );

        const maxed =
          data.five_hour.utilization >= 100 ||
          data.seven_day.utilization >= 100 ||
          (hasOpus && data.seven_day_opus.utilization >= 100) ||
          (hasSonnet && data.seven_day_sonnet.utilization >= 100);
        updateMaxedSprite(maxed);

        tickTime();
      }

      function tickTime() {
        if (!usageData) return;
        document.getElementById("current-countdown").textContent =
          formatCountdown(usageData.five_hour.resets_at);
        document.getElementById("weekly-countdown").textContent =
          formatCountdown(usageData.seven_day.resets_at);
      }

      function renderError(msg, hint) {
        fetchError = true;
        spritesPaused = true;
        setSprite(SPRITE_BASE + "idle_blink.mp4");

        document.getElementById("current-card").style.display = "none";
        document.getElementById("weekly-card").style.display = "none";
        document.getElementById("error-panel").classList.add("visible");
        document.getElementById("status-icon").textContent = "";
        document.getElementById("status-verb").textContent = "";

        document.getElementById("err-msg").textContent = msg;

        const hintRow = document.getElementById("err-hint-row");
        if (hint) {
          document.getElementById("err-hint").textContent = hint;
          hintRow.style.display = "flex";
        } else {
          hintRow.style.display = "none";
        }

        if (retryTimer) clearInterval(retryTimer);
        let countdown = 30;
        document.getElementById("err-countdown").textContent = countdown;
        retryTimer = setInterval(() => {
          countdown = Math.max(0, countdown - 1);
          document.getElementById("err-countdown").textContent = countdown;
          if (countdown === 0) clearInterval(retryTimer);
        }, 1000);
      }

      function renderOk() {
        if (!fetchError) return;
        fetchError = false;
        spritesPaused = false;
        setSprite(SPRITE_BASE + SPRITES[spriteIdx]);
        document.getElementById("current-card").style.display = "";
        document.getElementById("weekly-card").style.display = "";
        document.getElementById("error-panel").classList.remove("visible");
        document.getElementById("status-text").style.color = "#d97757";
        if (retryTimer) clearInterval(retryTimer);
      }

      async function fetchAndRender() {
        try {
          const res = await fetch("/usage");
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            renderError(
              body.message || `HTTP ${res.status}`,
              body.hint || null,
            );
            return;
          }
          const data = await res.json();
          renderOk();
          render(data);
        } catch (e) {
          console.error("Failed to fetch /usage:", e);
          renderError(e.message || "fetch error", null);
        }
      }

      fetchAndRender();
      setInterval(fetchAndRender, 30_000);
      setInterval(tickTime, 1_000);
      setInterval(tickSpinner, 50); // check every 50ms, fire based on per-frame ms
    </script>
  </body>
</html>
