<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, user-scalable=no">
  <title>Claude Usage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #000;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      background: #000;
      color: #faf9f5;
      font-family: 'DM Sans', system-ui, sans-serif;
      width: 800px;
      height: 480px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px 22px 12px;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      height: 54px;
      gap: 18px;
    }

    .logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      image-rendering: pixelated;
    }

    .title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 40px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #faf9f5;
    }

    /* ── Cards ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: #1f1f1e;
      border-radius: 10px;
      padding: 12px 18px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
    }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .pct {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 58px;
      font-weight: 400;
      line-height: 1;
      color: #faf9f5;
    }

    .badge {
      background: #3d2060;
      border-radius: 20px;
      padding: 5px 20px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #faf9f5;
    }

    /* ── Progress bars ── */
    .progress-track {
      background: #2a2a28;
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      border-radius: 6px;
      width: 0%;
      transition: width 0.7s ease, background-color 0.7s ease;
    }

    .countdown {
      font-size: 14px;
      font-weight: 300;
      color: #b0aea5;
      letter-spacing: 0.2px;
    }

    /* ── Sub-bars (Opus / Sonnet) ── */
    .sub-bars {
      display: none;
      flex-direction: column;
      gap: 5px;
      margin-top: 2px;
    }

    .sub-bar-row {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .sub-bar-label {
      font-size: 11px;
      width: 48px;
      color: #b0aea5;
      flex-shrink: 0;
    }

    .sub-bar-track {
      background: #2a2a28;
      border-radius: 4px;
      height: 8px;
      flex: 1;
      overflow: hidden;
    }

    .sub-bar-fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.7s ease;
    }

    .sub-bar-pct {
      font-size: 11px;
      width: 34px;
      text-align: right;
      color: #b0aea5;
      flex-shrink: 0;
    }

    /* ── Status bar ── */
    .status-bar {
      flex-shrink: 0;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      color: #d97757;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 2px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="header">
    <img class="logo" src="/logo.png" alt="Claude">
    <span class="title">Usage</span>
  </div>

  <div class="cards">

    <div class="card">
      <div class="card-header">
        <span class="pct" id="current-pct">--</span>
        <span class="badge">Current</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="current-bar"></div>
      </div>
      <div class="countdown" id="current-countdown">--</div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="pct" id="weekly-pct">--</span>
        <span class="badge">Weekly</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="weekly-bar"></div>
      </div>
      <div class="countdown" id="weekly-countdown">--</div>
      <div class="sub-bars" id="sub-bars">
        <div class="sub-bar-row" id="opus-row">
          <span class="sub-bar-label">Opus</span>
          <div class="sub-bar-track">
            <div class="sub-bar-fill" id="opus-fill"></div>
          </div>
          <span class="sub-bar-pct" id="opus-pct"></span>
        </div>
        <div class="sub-bar-row" id="sonnet-row">
          <span class="sub-bar-label">Sonnet</span>
          <div class="sub-bar-track">
            <div class="sub-bar-fill" id="sonnet-fill"></div>
          </div>
          <span class="sub-bar-pct" id="sonnet-pct"></span>
        </div>
      </div>
    </div>

  </div>

  <div class="status-bar">
    <span class="status-text" id="status-text">* Active</span>
  </div>

  <script>
    'use strict';

    /* ── Status text cycling (from Clawdmeter phrase pool) ── */
    const STATUS_PHRASES = [
      'Baking', 'Brewing', 'Clauding', 'Crafting', 'Coding',
      'Debugging', 'Deliberating', 'Designing', 'Drafting',
      'Editing', 'Engineering', 'Exploring', 'Fetching',
      'Finalizing', 'Finishing', 'Focusing', 'Formulating',
      'Generating', 'Glowing', 'Grooving', 'Hashing',
      'Hatching', 'Healing', 'Iterating', 'Musing',
      'Pondering', 'Processing', 'Reasoning', 'Rendering',
      'Scheming', 'Synthesizing', 'Thinking', 'Vibing',
      'Wandering', 'Weaving', 'Working'
    ];
    let phraseIdx = Math.floor(Math.random() * STATUS_PHRASES.length);
    function cycleStatus() {
      phraseIdx = (phraseIdx + 1) % STATUS_PHRASES.length;
      document.getElementById('status-text').textContent =
        '* ' + STATUS_PHRASES[phraseIdx] + '...';
    }
    setInterval(cycleStatus, 4000);
    cycleStatus();

    /* ── Usage data ── */
    let usageData = null;

    function getColor(pct) {
      return pct < 50 ? '#788c5d' : '#d97757';
    }

    function formatCountdown(isoString) {
      const diff = new Date(isoString) - Date.now();
      if (diff <= 0) return 'Resetting...';
      const totalSec = Math.floor(diff / 1000);
      const days    = Math.floor(totalSec / 86400);
      const hours   = Math.floor((totalSec % 86400) / 3600);
      const mins    = Math.floor((totalSec % 3600) / 60);
      const secs    = totalSec % 60;
      if (days  > 0) return `Resets in ${days}d ${hours}h`;
      if (hours > 0) return `Resets in ${hours}h ${mins}m`;
      return `Resets in ${mins}m ${secs}s`;
    }

    function applyBar(fillId, pctId, utilization) {
      const pct   = Math.round(Math.max(0, Math.min(100, utilization)));
      const color = getColor(pct);
      document.getElementById(fillId).style.width      = pct + '%';
      document.getElementById(fillId).style.background = color;
      if (pctId) {
        document.getElementById(pctId).textContent = pct + '%';
      }
    }

    function render(data) {
      if (!data.five_hour || !data.seven_day) return;
      usageData = data;

      applyBar('current-bar', 'current-pct', data.five_hour.utilization);
      applyBar('weekly-bar',  'weekly-pct',  data.seven_day.utilization);

      const hasOpus   = data.seven_day_opus   !== null;
      const hasSonnet = data.seven_day_sonnet !== null;
      const hasAny    = hasOpus || hasSonnet;

      document.getElementById('sub-bars').style.display   = hasAny    ? 'flex' : 'none';
      document.getElementById('opus-row').style.display   = hasOpus   ? 'flex' : 'none';
      document.getElementById('sonnet-row').style.display = hasSonnet ? 'flex' : 'none';

      if (hasOpus)   applyBar('opus-fill', 'opus-pct',    data.seven_day_opus.utilization);
      if (hasSonnet) applyBar('sonnet-fill', 'sonnet-pct', data.seven_day_sonnet.utilization);

      tick();
    }

    function tick() {
      if (!usageData) return;
      document.getElementById('current-countdown').textContent =
        formatCountdown(usageData.five_hour.resets_at);
      document.getElementById('weekly-countdown').textContent =
        formatCountdown(usageData.seven_day.resets_at);
    }

    async function fetchAndRender() {
      try {
        const res  = await fetch('/usage');
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error('Failed to fetch /usage:', e);
      }
    }

    fetchAndRender();
    setInterval(fetchAndRender, 30_000);
    setInterval(tick, 1_000);
  </script>
</body>
</html>
